name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: [ dev, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Blazor Frontend
        run: dotnet publish TaskFlow.Blazor/TaskFlow.Blazor.csproj -c Release -o release --nologo

      - name: Locate and organize web files
        run: |
          # Hitta var index.html faktiskt hamnade och flytta filerna till en ren utmatningsmapp
          mkdir -p dist
          WEBROOT_PATH=$(find release -name "index.html" | head -n 1 | sed 's/\/index.html//')
          
          if [ -n "$WEBROOT_PATH" ]; then
            echo "Hittade webbfiler i: $WEBROOT_PATH"
            cp -r $WEBROOT_PATH/. dist/
          else
            echo "ERRA: Kunde inte hitta index.html i release-mappen!"
            exit 1
          fi

      - name: Fix base-href for GitHub Pages
        run: |
          if [ -f "dist/index.html" ]; then
            sed -i 's/<base href="\/" \/>/<base href="\/TaskFlow\/" \/>/g' dist/index.html
          fi

      - name: Copy index.html to 404.html
        run: |
          if [ -f "dist/index.html" ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
