name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: [ dev, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Blazor Frontend
        run: dotnet publish TaskFlow.Blazor/TaskFlow.Blazor.csproj -c Release -o release

      - name: Copy index.html to 404.html
        run: cp release/wwwroot/index.html release/wwwroot/404.html || cp release/TaskFlow.Blazor/wwwroot/index.html release/TaskFlow.Blazor/wwwroot/404.html || true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages
